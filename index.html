<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Habit App</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f4f7fb;color:#0f172a}
    .loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
    .loading strong{display:block;font-size:18px;margin-bottom:6px}
    .loading span{color:#64748b;font-size:13px}
  </style>
</head>
<body>
  <div class="loading" id="loader"><div><strong>Loading My Habit App…</strong><span>Preparing your habit grid.</span></div></div>
  <script>
    (async function(){
      try{
        const response = await fetch('./app-v22-base.html?v=20260904-gridfix1', {cache:'no-store'});
        if(!response.ok) throw new Error('Could not load app (' + response.status + ')');
        let html = await response.text();
        html = html.replace('</head>', '<link rel="stylesheet" href="./habit-grid-fix.css?v=20260904-gridfix1"></head>');
        html = html.replace('</body>', '<script src="./habit-grid-fix.js?v=20260904-gridfix1"><\/script></body>');
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        console.error(error);
        document.getElementById('loader').innerHTML = '<div><strong>Could not load the Habit App</strong><span>' + String(error && error.message || error) + '</span></div>';
      }
    })();
  </script>
</body>
</html>
